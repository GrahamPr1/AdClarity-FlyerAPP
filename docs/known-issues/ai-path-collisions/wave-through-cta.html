<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 8.5in; height: 11in; }
  body { font-family: Georgia, serif; background: #f2efe6; color: #1f3d2b; }
  .page { width: 8.5in; height: 11in; padding: 0.95in 0.9in; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .frame { position: absolute; top: 0.45in; left: 0.45in; right: 0.45in; bottom: 0.45in; border: 1.5px solid rgba(200,144,46,0.55); pointer-events: none; }
  .horizon { position: absolute; left: 0.9in; right: 0.9in; height: 60px; opacity: 0.5; }
  .horizon.top { top: 0.75in; }
  .horizon.bottom { bottom: 1.6in; transform: scaleY(-1); }
  .content { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.1rem; padding-top: 1.1in; }
  .icon-mark { margin-bottom: 0.3rem; }
  h1 { font-size: 3.3rem; font-weight: 700; color: #1f3d2b; line-height: 1.15; max-width: 6in; }
  .sub { font-size: 1.2rem; font-style: italic; color: #1f3d2b; max-width: 5in; line-height: 1.6; }
  .medallion-wrap { position: relative; width: 3.3in; height: 3.3in; display: flex; align-items: center; justify-content: center; }
  .medallion-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #c8902e; }
  .medallion { width: 2.85in; height: 2.85in; border-radius: 50%; background: linear-gradient(145deg, #234a33, #16301f); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5in; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .medallion .line1 { font-size: 1.55rem; font-weight: 700; color: #f2efe6; line-height: 1.25; }
  .medallion .line2 { font-size: 1.05rem; color: #f2efe6; line-height: 1.3; }
  .cta-block { display: flex; flex-direction: column; align-items: center; gap: 0.85rem; }
  .cta-note { font-size: 1.05rem; font-style: italic; color: #1f3d2b; }
  .cta-button { display: inline-block; background: #c8902e; color: #1f3d2b; font-weight: 700; font-size: 1.3rem; padding: 0.7rem 1.8rem; border-radius: 999px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 4px 10px rgba(31,61,43,0.25); }
  .cta-button:hover { transform: scale(1.04); box-shadow: 0 6px 16px rgba(31,61,43,0.35); }
  .cta-button:focus-visible { outline: 3px solid #1f3d2b; outline-offset: 3px; }
  .footer { margin-top: auto; text-align: center; border-top: 1px solid rgba(31,61,43,0.3); padding-top: 0.5in; }
  .footer .name { font-size: 1.15rem; font-weight: 700; color: #1f3d2b; }
  .footer .addr { font-size: 0.95rem; color: #1f3d2b; margin-top: 0.25rem; }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>
  <svg class="horizon top" viewBox="0 0 600 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 Q75,10 150,35 T300,30 T450,38 T600,25" stroke="#c8902e" stroke-width="2" fill="none"/>
  </svg>
  <div class="content">
    <svg class="icon-mark" width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
      <circle cx="26" cy="20" r="9" fill="#c8902e"/>
      <path d="M4 38 L18 24 L26 32 L36 20 L48 38 Z" fill="#1f3d2b"/>
    </svg>
    <h1>A Place to<br>Call Home</h1>
    <p class="sub">Privacy, room to roam, and a quieter way of living.</p>
    <div class="medallion-wrap">
      <div class="medallion-ring"></div>
      <div class="medallion">
        <span class="line1">Rural Properties</span>
        <span class="line2">near Barren River Lake State Park</span>
      </div>
    </div>
    <div class="cta-block">
      <p class="cta-note">Personal guidance from a local agent</p>
      <a class="cta-button" href="tel:2705550177">Call 270-555-0177</a>
    </div>
  </div>
  <svg class="horizon bottom" viewBox="0 0 600 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 Q75,10 150,35 T300,30 T450,38 T600,25" stroke="#c8902e" stroke-width="2" fill="none"/>
  </svg>
  <div class="footer">
    <div class="name">Taylor Welch Realty</div>
    <div class="addr">Glasgow, KY</div>
  </div>
</div>
</body>
</html>

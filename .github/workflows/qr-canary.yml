# Hourly health check for QR codes, run from GitHub, outside Vercel, so it still
# fires when the Vercel project or a domain is the problem.
#
# Scans one known real code on both hosts QR codes point at: the vercel.app
# address on older printed flyers, and oneflyer.org on newer ones. Each must
# show that code's business name, with its assets and click counter served.
# Both hosts are always checked, and the last step says which one failed:
# old flyers, new flyers, or both.
#
# Needs two repository VARIABLES (Settings > Secrets and variables > Actions >
# Variables): QR_CHECK_CODE and QR_CHECK_TEXT, the exact business name. Each run
# counts scans on that code, so use a dedicated flyer. If either is missing the
# run fails, rather than looking healthy while checking nothing.
#
# A failed run is what alerts: GitHub notifies whoever last changed the schedule.
name: QR canary

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QR_CHECK_CODE: ${{ vars.QR_CHECK_CODE }}
      QR_CHECK_TEXT: ${{ vars.QR_CHECK_TEXT }}
    steps:
      - name: Require the monitor settings
        id: settings
        run: |
          if [ -z "$QR_CHECK_CODE" ] || [ -z "$QR_CHECK_TEXT" ]; then
            echo "::error::Set the repository variables QR_CHECK_CODE and QR_CHECK_TEXT."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check-legacy-domain.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
      # One retry after a minute on each, so a single network blip doesn't page
      # anyone. Each runs whatever happened to the other: a failure on one host
      # must not hide the state of the other.
      - name: Check the QR code on the vercel.app address (older printed flyers)
        id: legacy
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node scripts/check-legacy-domain.mjs --canary || (sleep 60 && node scripts/check-legacy-domain.mjs --canary)
      - name: Check the QR code on oneflyer.org (newer flyers)
        id: canonical
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node scripts/check-legacy-domain.mjs --canary --legacy https://oneflyer.org || (sleep 60 && node scripts/check-legacy-domain.mjs --canary --legacy https://oneflyer.org)
      - name: Report both hosts
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && steps.node.outcome == 'success' }}
        env:
          LEGACY: ${{ steps.legacy.outcome }}
          CANONICAL: ${{ steps.canonical.outcome }}
        run: |
          {
            echo "### QR check for /r/$QR_CHECK_CODE"
            echo "| Host | Flyers | Result |"
            echo "|---|---|---|"
            echo "| ad-clarity-landing-page.vercel.app | older printed flyers | $LEGACY |"
            echo "| oneflyer.org | newer flyers | $CANONICAL |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LEGACY" = success ] && [ "$CANONICAL" = success ]; then echo "Both hosts OK."; exit 0; fi
          if [ "$LEGACY" != success ] && [ "$CANONICAL" != success ]; then
            echo "::error::QR codes are failing on BOTH hosts: old and new flyers."
          elif [ "$LEGACY" != success ]; then
            echo "::error::QR codes are failing on ad-clarity-landing-page.vercel.app: OLDER printed flyers. oneflyer.org is OK."
          else
            echo "::error::QR codes are failing on oneflyer.org: NEWER flyers. ad-clarity-landing-page.vercel.app is OK."
          fi
          exit 1

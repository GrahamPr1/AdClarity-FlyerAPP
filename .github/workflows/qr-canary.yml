# Standing health check for printed QR codes.
#
# Every printed OneFlyer QR code points at ad-clarity-landing-page.vercel.app/r/<code>.
# If that domain is detached, protected, redirected or broken, every flyer
# already in someone's mailbox stops working, and nothing in the app would
# notice. This runs from GitHub, outside Vercel, so it still fires when the
# Vercel project or the domain itself is the problem.
#
# It scans a known real code and checks the page shows that code's business
# name, and that its assets and the click counter are served on the legacy
# host. A failing run is a failed workflow, which GitHub emails about.
#
# Set two repository variables: QR_CHECK_CODE and QR_CHECK_TEXT (the business
# name). Each run counts scans on that code, so use a flyer of your own. Unset,
# it falls back to the health-canary record and fails if that doesn't exist.
name: QR canary

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check-legacy-domain.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # One retry after a minute, so a single network blip doesn't page anyone.
      - name: Check printed QR codes resolve on the legacy domain
        env:
          QR_CHECK_CODE: ${{ vars.QR_CHECK_CODE }}
          QR_CHECK_TEXT: ${{ vars.QR_CHECK_TEXT }}
        run: node scripts/check-legacy-domain.mjs --canary || (sleep 60 && node scripts/check-legacy-domain.mjs --canary)

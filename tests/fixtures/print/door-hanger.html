ount{font-family:'Poppins',sans-serif;font-weight:800;font-size:56px;color:#F4EFE9;line-height:1;letter-spacing:-1px;}.off-label{font-family:'Poppins',sans-serif;font-weight:600;font-size:20px;letter-spacing:5px;color:#C8A24A;margin-top:4px;}.furnace-label{font-family:'Inter',sans-serif;font-weight:600;font-size:11px;letter-spacing:2px;color:rgba(244,239,233,0.85);margin-top:10px;text-transform:uppercase;}.supporting{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;color:#5C1F2B;margin-bottom:20px;letter-spacing:0.2px;}.phone-btn{font-family:'Poppins',sans-serif;font-weight:700;font-size:27px;color:#5C1F2B;text-decoration:none;background:#F4EFE9;border:2px solid #C8A24A;border-radius:999px;padding:10px 28px;display:inline-block;transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;letter-spacing:0.5px;}.phone-btn:hover{background:#C8A24A;color:#5C1F2B;transform:scale(1.03);box-shadow:0 4px 10px rgba(200,162,74,0.45);}.phone-btn:focus-visible{outline:3px solid #5C1F2B;outline-offset:3px;}.disclaimer{font-size:7.5px;color:rgba(92,31,43,0.55);margin-top:auto;padding-top:18px;letter-spacing:0.2px;}</style></head><body><div class="hanger"><div class="hang-zone"><div class="hang-hole"></div></div><div class="content"><div class="eyebrow">Miller Heating &amp; Air</div><h1 class="headline">New Furnace?</h1><div class="ornament-row"><div class="ornament-line"></div><div class="ornament-dot"></div><div class="ornament-line"></div></div><div class="medallion"><div class="medallion-inner"><span class="amount">$500</span><span class="off-label">OFF</span><span class="furnace-label">New Furnace Install</span></div></div><p class="supporting">Serving Denver since 1998</p><a href="tel:3035557788" class="phone-btn">(303) 555-7788</a><p class="disclaimer">Offer expires 30 days from receipt.</p></div></div></body></html>
